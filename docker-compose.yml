services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agroiam
      POSTGRES_USER: agroiam
      POSTGRES_PASSWORD: agroiam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroiam -d agroiam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://agroiam:agroiam@db:5432/agroiam?sslmode=disable
      - up

volumes:
  pgdata:
  redisdata:
